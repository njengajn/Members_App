{% extends "members/emails/base_email.html" %}

{% block email_content %}

<p
    class="email-text"
    style="
        font-size:16px;
        color:#555555;
        line-height:1.6;
    "
>

    Your membership has been retired.

</p>

<div
    style="
        background:#f8d7da;
        padding:20px;
        border-radius:10px;
        margin:25px 0;
    "
>

    Reason:

    <strong>

        {{ reason }}

    </strong>

</div>

<p
    class="email-text"
    style="
        font-size:16px;
        color:#555555;
        line-height:1.6;
    "
>

    Please contact KRO admin for assistance if you think think has happened in error. Do not reply to this email.

</p>

{% endblock %}
