{% extends "members/base.html" %}
{% block content %}
<h3>Documents</h3>

<div class="row gy-3">
  {% for doc in documents %}
    <div class="col-sm-6 col-md-4 col-lg-3">
      <div class="card">
        {% include "members/includes/file_preview_card.html" with doc=doc %}
      </div>
    </div>
  {% empty %}
    <p>No documents.</p>
  {% endfor %}
</div>

<!-- View All Modal trigger -->
<button class="btn btn-secondary mt-4" data-bs-toggle="modal" data-bs-target="#viewAllModal">View All Documents</button>
{% include "members/documents/view_all_documents_modal.html" %}
{% endblock %}
