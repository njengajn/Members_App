{% extends "members/base.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}
<div class="container text-center">
  <h2 class="text-success mb-4">Admin Dashboard</h2>

  <div class="row g-4 justify-content-center">
    <div class="col-md-4">
      <div class="card shadow border-0">
        <div class="card-body">
          <h5 class="card-title">Manage Members</h5>
          <a href="{% url 'members_admin:members' %}" class="btn btn-dark w-100">Go</a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow border-0">
        <div class="card-body">
          <h5 class="card-title">Create Payment Request</h5>
          <a href="{% url 'members_admin:create_payment_request' %}" class="btn btn-danger w-100">Go</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
