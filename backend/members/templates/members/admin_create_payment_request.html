{% extends 'members/admin/admin_base.html' %}
{% load static %}

{% block title %}Create Payment Request{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
  <div class="card shadow-lg border-0 rounded-3">
    <div class="card-header bg-dark text-white text-center">
      <h4 class="mb-0">Create Payment Request</h4>
    </div>
    <div class="card-body p-4">

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST" action="">
        {% csrf_token %}
        
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="member" class="form-label fw-bold">Member</label>
            <select name="member" id="member" class="form-select" required>
              <option value="">-- Select Member --</option>
              {% for member in members %}
                <option value="{{ member.uid }}">{{ member.first_name }} {{ member.surname }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-md-6">
            <label for="amount" class="form-label fw-bold">Amount (£)</label>
            <input type="number" step="0.01" class="form-control" id="amount" name="amount" placeholder="Enter amount" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="due_date" class="form-label fw-bold">Due Date</label>
            <input type="date" id="due_date" name="due_date" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label for="request_type" class="form-label fw-bold">Request Type</label>
            <select name="request_type" id="request_type" class="form-select" required>
              <option value="">-- Select Type --</option>
              <option value="membership">Membership</option>
              <option value="subscription">Subscription</option>
              <option value="claim">Claim</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label for="authorised_by" class="form-label fw-bold">Authorised By</label>
          <select name="authorised_by" id="authorised_by" class="form-select" required>
            <option value="">-- Select Admin/Staff --</option>
            {% for user in admins %}
              <option value="{{ user.id }}">{{ user.username }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-success px-4 me-2">Create Request</button>
          <a href="{% url 'members_admin:create_payment_request' %}" class="btn btn-outline-secondary px-4">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
