{% load static %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Members Portal{% endblock %}</title>

  <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
   <link href="https://unpkg.com/cropperjs/dist/cropper.min.css" rel="stylesheet"/>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Flowbite -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/1.9.3/flowbite.min.css" rel="stylesheet" />

  <!-- Custom -->
  <link rel="stylesheet" href="{% static 'CSS/styles.css' %}">
  <link rel="stylesheet" href="{% static 'css/mobile-ui.css' %}">

  {% block head %}{% endblock %}
</head>

<body class="d-flex flex-column min-vh-100">

  <!-- ✅ SINGLE NAVBAR -->
  {% include "members/navbar.html" %}

  <main class="flex-fill container py-4">
    {% include "members/alerts.html" %}
    {% block content %}{% endblock %}
  </main>

  {% include "members/footer.html" %}

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/1.9.3/flowbite.min.js"></script>


  {% block scripts %}{% endblock %}
</body>
</html>
