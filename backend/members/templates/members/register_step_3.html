{% extends "members/base.html" %}
{% load static %}

{% block content %}
<div class="container mx-auto max-w-lg mt-10">
  <h2 class="text-2xl font-bold mb-4 text-center">Next of Kin Details</h2>
  {% include "members/_progress.html" with step=3 progress=60 %}

  <form method="post" class="space-y-4 bg-white p-6 rounded-lg shadow">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex justify-between">
      <a href="{% url 'members:register_step_2_member' %}" class="btn btn-secondary">Back</a>
      <button type="submit" class="btn btn-primary">Continue</button>
    </div>
  </form>
</div>
{% endblock %}
