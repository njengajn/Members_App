{% extends "members/register/register_base.html" %}
{% load static %} 
{% block register_content %}

<h4>Email Verification</h4>
<p>Enter the code sent to your email.</p>

<form method="post">
  {% csrf_token %}

  <div class="mb-3">
    <label>Verification Code</label>
    <input name="otp" class="form-control" required>
  </div>

  <button class="btn btn-success">Verify</button>

  <!-- RESEND -->
  <button name="resend" value="1" class="btn btn-link">
    Resend Code
  </button>

</form>

{% endblock %}
