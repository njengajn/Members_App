<!-- backend/members/templates/members/admin_member_edit.html -->
{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h3>Edit Member: {{ member.first_name }} {{ member.surname }}</h3>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary mt-2">Save</button>
        <a href="{% url 'members_admin:admin_members' %}" class="btn btn-secondary mt-2">Cancel</a>
    </form>
</div>
{% endblock %}
