{% extends "members/admin/admin_base.html" %}

{% block content %}
<div class="container mt-4">

<h4>Edit Next of Kin</h4>

<form method="POST">
  {% csrf_token %}

  <div class="mb-3">
    <label>First Name</label>
    <input type="text" name="first_name"
           value="{{ nok.first_name }}"
           class="form-control">
  </div>

  <div class="mb-3">
    <label>Surname</label>
    <input type="text" name="surname"
           value="{{ nok.surname }}"
           class="form-control">
  </div>

  <div class="mb-3">
    <label>Relationship</label>
    <input type="text" name="relationship"
           value="{{ nok.relationship }}"
           class="form-control">
  </div>

  <div class="mb-3">
    <label>Phone</label>
    <input type="text" name="phone"
           value="{{ nok.phone }}"
           class="form-control">
  </div>

  <div class="mb-3">
    <label>Email</label>
    <input type="email" name="email"
           value="{{ nok.email }}"
           class="form-control">
  </div>

  <button class="btn btn-success">Save</button>

</form>
</div>
{% endblock %}
