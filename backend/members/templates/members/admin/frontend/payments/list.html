{% extends "members/base.html" %}
{% block title %}Payment Requests{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Payment Requests</h2>
    <hr>

    <table class="table table-striped">
        <thead>
        <tr><th>ID</th><th>Amount</th><th>Status</th><th>View</th></tr>
        </thead>
        <tbody>
        {% for p in payments %}
            <tr>
                <td>{{ p.id }}</td>
                <td>${{ p.amount }}</td>
                <td>{{ p.status }}</td>
                <td>
                    <a href="{% url 'members:payment_request_detail' p.id %}" class="btn btn-primary btn-sm">View</a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
