{% extends "members/members_base.html" %}
{% load static %}

{% block content %}

<h3>My Profile</h3>

<div class="card p-4">

<form method="post" id="profileForm" enctype="multipart/form-data">
{% csrf_token %}

<div class="text-center mb-3">

<div id="avatarPreview" class="avatar-circle mx-auto mb-2">

{% if member.avatar %}
<img src="{{ member.avatar.url }}" class="avatar-img">
{% else %}
<span class="avatar-initials">
{{ member.first_name|first }}{{ member.surname|first }}
</span>
{% endif %}

</div>

<input type="file" id="avatarInput" accept="image/*" class="form-control mt-2">

<input type="hidden" name="cropped_avatar" id="croppedAvatar">

</div>

<input name="first_name" class="form-control mb-2" value="{{ member.first_name }}">
<input name="surname" class="form-control mb-2" value="{{ member.surname }}">
<input name="phone" class="form-control mb-2" value="{{ member.phone }}">

<button type="submit" class="btn btn-primary w-100 mt-2">Save Changes</button>

</form>

</div>

<!-- ✅ LOCKED VERSION (IMPORTANT) -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<!-- Bootstrap (must be AFTER cropper is fine) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<div class="modal fade" id="cropModal" tabindex="-1">

<div class="modal-dialog modal-lg">
<div class="modal-content">

<!-- HEADER -->
<div class="modal-header">
<h5 class="modal-title">Crop Image</h5>

<!-- ✅ CLOSE BUTTON -->
<button type="button"
        class="btn-close"
        data-bs-dismiss="modal"
        aria-label="Close">
</button>
</div>

<!-- BODY -->
<div class="modal-body text-center">

<div class="crop-container">
    <img id="cropImage" class="crop-image">
</div>

</div>

<!-- FOOTER -->
<div class="modal-footer">

<!-- ✅ CANCEL BUTTON -->
<button type="button"
        class="btn btn-secondary"
        id="cancelCropBtn">
Cancel
</button>

<!-- APPLY -->
<button type="button"
        class="btn btn-success"
        id="cropBtn">
Apply Crop
</button>

</div>

</div>
</div>
</div>

<style>
.cropper-view-box,
.cropper-face {
    border: 2px solid #0d6efd;
}

/* =========================
   CROP CONTAINER
========================= */
.crop-container {
    width: 100%;
    max-width: 500px;           /* keeps it neat */
    height: 300px;             /* 🔥 controls height */
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    background: #f8f9fa;
    border-radius: 10px;
}

/* =========================
   IMAGE INSIDE CROPPER
========================= */
.crop-image {
    max-width: 100%;
    max-height: 100%;
    display: block;
}

/* =========================
   PREVIEW AVATAR
========================= */
.avatar-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    overflow: hidden;
    background: #dee2e6;
    display: flex;
    align-items: center;
    justify-content: center;
}

.avatar-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.avatar-initials {
    font-size: 36px;
    font-weight: bold;
    color: #555;
}
</style>

<script>

let cropper;
let cropApplied = false;  // 🔥 TRACK STATE

const input = document.getElementById("avatarInput");
const image = document.getElementById("cropImage");
const hiddenInput = document.getElementById("croppedAvatar");

const modalEl = document.getElementById("cropModal");
const modal = new bootstrap.Modal(modalEl);

/* =========================
   FILE SELECT
========================= */
input.addEventListener("change", function(e){

const file = e.target.files[0];
if (!file) return;

cropApplied = false;  // reset flag

const url = URL.createObjectURL(file);
image.src = url;

modal.show();

});

/* =========================
   INIT CROPPER
========================= */
modalEl.addEventListener("shown.bs.modal", function(){

if (cropper) {
    cropper.destroy();
}

cropper = new Cropper(image, {
    aspectRatio: 1,
    viewMode: 1,
    autoCropArea: 1
});

});

/* =========================
   APPLY CROP
========================= */
document.getElementById("cropBtn").addEventListener("click", function(){

    if (!cropper) return;

    const canvas = cropper.getCroppedCanvas({
        width: 300,
        height: 300
    });

    if (!canvas) return;

    const base64 = canvas.toDataURL("image/jpeg");

    /* SAVE */
    hiddenInput.value = base64;
    cropApplied = true;   // 🔥 MARK SUCCESS

    /* UPDATE PREVIEW */
    document.getElementById("avatarPreview").innerHTML =
    `<img src="${base64}" class="avatar-img">`;

    modal.hide();

    });

/* =========================
   RESET FUNCTION
========================= */
function resetCropper() {

    if (cropper) {
        cropper.destroy();
        cropper = null;
    }

    /* ONLY reset if user did NOT crop */
    if (!cropApplied) {
        input.value = "";
        hiddenInput.value = "";
    }

    }

/* Cancel button */
document.getElementById("cancelCropBtn").addEventListener("click", function () {

    cropApplied = false;

    input.value = "";
    hiddenInput.value = "";

    if (cropper) {
        cropper.destroy();
        cropper = null;
    }

    modal.hide();

});

/* Close modal (X or outside click) */
modalEl.addEventListener("hidden.bs.modal", function(){

    resetCropper();

    });

/* =========================
   BLOCK BAD SUBMIT
========================= */
document.getElementById("profileForm").addEventListener("submit", function(e){

if (input.files.length > 0 && !hiddenInput.value) {
    e.preventDefault();
    alert("Please crop your image before saving.");
}

});

</script>

{% endblock %}
