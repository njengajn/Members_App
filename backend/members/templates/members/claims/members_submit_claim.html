{% extends "members/base.html" %}
{% block title %}Submit Claim{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="card shadow-lg p-4 mx-auto" style="max-width: 700px;">
    <h3 class="text-center mb-4 text-success">Submit a Claim</h3>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">{{ form.as_p }}</div>
      <div class="text-center">
        <button type="submit" class="btn btn-success px-4">Submit Claim</button>
      </div>
    </form>

    {% if messages %}
      <div class="mt-4">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  </div>
</div>
{% endblock %}
