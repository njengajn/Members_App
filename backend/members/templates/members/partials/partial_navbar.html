{% load static %} 
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
  <div class="container">

    <a class="navbar-brand fw-bold" href="{% url 'members:home' %}">
      Members Portal
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav" aria-controls="navbarNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto">

        <li class="nav-item">
          <a class="nav-link" href="{% url 'members:member_dashboard' %}">Dashboard</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'members:dependants' %}">Dependants</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'members:payment_requests' %}">Payments</a>
        </li>

      </ul>

      <ul class="navbar-nav ms-auto">
        {% if request.user.is_authenticated %}

        <li class="nav-item">
          <form action="{% url 'members_admin:logout' %}" method="post" style="display:inline;">
              {% csrf_token %}
              <button class="btn btn-outline-danger">Logout</button>
          </form>
        </li>

        {% else %}

        <li class="nav-item">
          <a class="btn btn-success" href="{% url 'members:login' %}">Login</a>
        </li>

        <li class="nav-item ms-2">
          <a class="btn btn-primary" href="{% url 'members:register' %}">Register</a>
        </li>

        {% endif %}
      </ul>
    </div>
  </div>
</nav>
